<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3261e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="血壓血糖">
<title>血壓血糖手冊</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 溫和清楚，像診所護理師；一頁只做一件事
   IDEA: 血壓計的大數字螢幕＋電話撥號鍵盤
   PICTURE: 大數字顯示格與 3x4 撥號鍵就是畫面
   COLOUR and TYPE: 白底深墨；血壓磚紅、血糖靛藍；Noto Sans TC 大字
   LAYOUT: 手機單欄，底部固定分頁列，按鍵 60px 以上 */
:root{color-scheme:light dark;
--bg:light-dark(#f6f4ef,#121418);--card:light-dark(#fff,#1c1f25);--ink:light-dark(#1b1d21,#eef0f3);
--mute:light-dark(#62666e,#a4aab4);--line:light-dark(#e2ded5,#2f333b);--key:light-dark(#efece5,#262a31);
--bp:light-dark(#b3261e,#ff8a7f);--bp2:light-dark(#e39a93,#a0524b);--gl:light-dark(#1f4fa8,#8fb3ff);
--ok:light-dark(#1f7a4a,#6fd39d);--warn:light-dark(#9a5a00,#ffc46b);--bad:light-dark(#b3261e,#ff8a7f);
--acc:var(--bp);--on:light-dark(#fff,#15161a)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
.app{max-width:480px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:36px;line-height:1.1;margin:24px 0 6px;font-weight:900}
h2{font-size:30px;line-height:1.1;margin:4px 0 10px;font-weight:900;color:var(--acc)}
.sub{color:var(--mute);margin:0 0 20px}
label.t{display:block;font-weight:700;margin:14px 0 6px}
input.txt{font:inherit;font-size:24px;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);min-height:60px}
.btn{display:block;width:100%;min-height:64px;border-radius:16px;font-size:24px;font-weight:900;background:var(--acc);color:var(--on);margin-top:14px}
.btn:disabled{opacity:.5}
.link{background:none;color:var(--gl);text-decoration:underline;min-height:48px;padding:6px 0;font-size:18px}
.msg{min-height:1.6em;margin-top:10px;font-weight:700;text-align:center}
.err{color:var(--bad)}
/* 撥號鍵盤 */
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.pad button{min-height:64px;border-radius:16px;background:var(--key);font-size:32px;font-weight:700;box-shadow:0 2px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:none}
.pad button.fn{font-size:19px;color:var(--mute)}
.pad button.go{background:var(--acc);color:var(--on);font-size:20px}
.pad button.blank{visibility:hidden}
@media(max-height:700px){.pad button{min-height:54px;font-size:28px}.btn{min-height:56px}}
/* 驗證碼點 */
.dots{display:flex;justify-content:center;gap:18px;margin:18px 0 4px}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink)}
.dots i.on{background:var(--ink)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.prompt{text-align:center;font-size:22px;font-weight:700;margin:10px 0 0}
.codeShow{text-align:center;color:var(--mute)}
/* 頂部 */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.who{font-size:20px;font-weight:900}
.small{min-height:44px;padding:6px 14px;border-radius:12px;background:var(--key);font-size:16px;font-weight:700}
.when{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--mute);margin-bottom:10px}
.when input{font:inherit;font-size:17px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:44px;flex:1}
/* 數字顯示格 */
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fld{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 6px 6px;text-align:center;min-height:104px}
.fld span{display:block;font-size:16px;font-weight:700;color:var(--mute);line-height:1.2}
.fld small{display:block;font-size:13px;font-weight:400}
.fld b{display:block;font-size:42px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.fld b.ph{color:var(--line)}
.fld.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.fld.one{min-height:120px}.fld.one b{font-size:58px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.chips button{min-height:52px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:17px;font-weight:700;line-height:1.2}
.chips button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--on)}
/* 底部分頁 */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;z-index:5}
.tabbar button{background:none;min-height:60px;border-radius:12px;font-size:17px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabbar svg{width:26px;height:26px}
.tabbar button[aria-selected=true]{color:var(--ink);background:var(--key)}
.tabbar button[data-p=bp][aria-selected=true]{color:var(--bp)}.tabbar button[data-p=gl][aria-selected=true]{color:var(--gl)}
/* 結果視窗 */
.sheet{position:fixed;inset:0;background:rgb(0 0 0/.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:26px 20px calc(20px + env(safe-area-inset-bottom));text-align:center}
.sheet .big{font-size:56px;font-weight:900;line-height:1.1}
.sheet .lab{display:inline-block;margin:8px 0;padding:4px 16px;border-radius:999px;font-size:22px;font-weight:900}
.sheet p{font-size:20px;margin:8px 0 0}
.lv-ok{background:light-dark(#e4f4ea,#173226);color:var(--ok)}.lv-warn{background:light-dark(#fdf0dc,#3a2c12);color:var(--warn)}
.lv-bad{background:light-dark(#fbe3e1,#3d1d1b);color:var(--bad)}.lv-low{background:light-dark(#e9eefb,#1c2540);color:var(--gl)}
/* 報告、歷史 */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--key);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{min-height:50px;border-radius:11px;background:none;font-size:20px;font-weight:900;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--acc);box-shadow:0 1px 3px rgb(0 0 0/.15)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tile{border-radius:14px;padding:10px 12px;background:var(--key)}
.tile .k{font-size:14px;color:var(--mute)}.tile .v{font-size:30px;font-weight:900;line-height:1.15;white-space:nowrap}.tile .d{font-size:14px}
.fig{position:relative;height:260px;margin:6px 0}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--mute)}
.sw{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.trend{font-size:18px;margin:10px 0 0;font-weight:500}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hv{font-size:26px;font-weight:900;white-space:nowrap}.hm{font-size:15px;color:var(--mute)}
.tag{font-size:14px;padding:2px 8px;border-radius:8px;vertical-align:middle;margin-left:6px}
.empty{color:var(--mute);text-align:center;padding:30px 10px;list-style:none}
.note{font-size:14px;color:var(--mute);margin-top:10px}
@media(prefers-reduced-motion:reduce){.shake{animation:none}.pad button:active{transform:none}}
</style>
</head>
<body>
<div class="app">

<!-- 登入 -->
<section id="vLogin">
  <img src="icon-180.png" alt="" width="72" height="72" style="border-radius:18px;margin-top:24px;display:block"><h1 style="margin-top:12px">血壓血糖手冊</h1>
  <p class="sub">每天量一下，記下來，看診時好跟醫師說。</p>
  <div id="step1">
    <label class="t" for="code">您的代碼</label>
    <input class="txt" id="code" maxlength="20" placeholder="例如 wang88" autocapitalize="off" autocomplete="username">
    <div id="nickWrap" class="hide">
      <label class="t" for="nick">怎麼稱呼您</label>
      <input class="txt" id="nick" maxlength="12" placeholder="例如 王奶奶">
    </div>
    <button class="btn" id="bNext" type="button">下一步</button>
    <button class="link" id="toggleReg" type="button">第一次使用？建立新代碼</button>
  </div>
  <div id="step2" class="hide">
    <p class="codeShow" id="codeShow"></p>
    <p class="prompt" id="pinPrompt">請輸入四碼驗證碼</p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pad" id="padPin"></div>
    <button class="link" id="bBack" type="button">← 換一個代碼</button>
  </div>
  <div class="msg err" id="loginMsg" role="status"></div>
  <p class="note">紀錄存在家人的 Google 試算表，換手機也看得到。驗證碼只是簡單的門鎖，請勿用銀行密碼。</p>
</section>

<!-- 主畫面 -->
<section id="vMain" class="hide">
  <div class="top"><div class="who" id="who"></div><button class="small" id="bOut" type="button">登出</button></div>

  <div id="pBp">
    <h2>量血壓</h2>
    <label class="when">時間 <input type="datetime-local" id="tBp"></label>
    <div class="fields">
      <button class="fld on" data-f="s" type="button"><span>收縮壓<small>上面的數字</small></span><b>—</b></button>
      <button class="fld" data-f="d" type="button"><span>舒張壓<small>下面的數字</small></span><b>—</b></button>
      <button class="fld" data-f="p" type="button"><span>脈搏<small>可不填</small></span><b>—</b></button>
    </div>
    <div class="pad" id="padBp"></div>
    <button class="btn" id="saveBp" type="button">儲存血壓</button>
  </div>

  <div id="pGl" class="hide">
    <h2>量血糖</h2>
    <label class="when">時間 <input type="datetime-local" id="tGl"></label>
    <div class="chips" id="meal">
      <button type="button" data-m="f" aria-pressed="true">空腹<br>飯前</button>
      <button type="button" data-m="a" aria-pressed="false">飯後<br>兩小時</button>
      <button type="button" data-m="r" aria-pressed="false">睡前<br>其他</button>
    </div>
    <div class="fld one on"><span>血糖值 <small style="display:inline">mg/dL</small></span><b id="glVal">—</b></div>
    <div class="pad" id="padGl"></div>
    <button class="btn" id="saveGl" type="button">儲存血糖</button>
  </div>

  <div id="pTrend" class="hide">
    <div class="seg" id="segT"><button type="button" data-k="bp" aria-pressed="true">血壓</button><button type="button" data-k="gl" aria-pressed="false">血糖</button></div>
    <div class="chips" id="range">
      <button type="button" data-d="7" aria-pressed="false">7 天</button>
      <button type="button" data-d="30" aria-pressed="true">30 天</button>
      <button type="button" data-d="90" aria-pressed="false">90 天</button>
    </div>
    <div class="card">
      <div class="tiles" id="tiles"></div>
      <div class="fig" id="fig"><svg id="svg" role="img" aria-label="趨勢圖"></svg></div>
      <div class="legend" id="legend"></div>
      <p class="trend" id="trend"></p>
    </div>
    <button class="btn" id="bCopy" type="button" style="background:var(--key);color:var(--ink);font-size:20px">複製報告給醫師或家人</button>
    <div class="msg" id="copyMsg" role="status" style="color:var(--ok)"></div>
    <p class="note">顏色依一般成人參考值：血壓 130/80；空腹血糖 100、飯後 140。僅供參考，以醫師給您的目標為準。</p>
  </div>

  <div id="pHist" class="hide">
    <div class="seg" id="segH"><button type="button" data-k="bp" aria-pressed="true">血壓</button><button type="button" data-k="gl" aria-pressed="false">血糖</button></div>
    <div class="card"><ul class="hist" id="hist"></ul></div>
  </div>

  <nav class="tabbar" role="tablist">
    <button type="button" data-p="bp" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>血壓</button>
    <button type="button" data-p="gl" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>血糖</button>
    <button type="button" data-p="trend" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>趨勢</button>
    <button type="button" data-p="hist" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>歷史</button>
  </nav>
</section>

<div class="sheet hide" id="sheet" role="dialog" aria-modal="true"><div>
  <div class="big" id="shBig"></div><div class="lab" id="shLab"></div><p id="shTxt"></p>
  <button class="btn" id="shOk" type="button">好</button>
</div></div>
<textarea id="copyBox" style="position:fixed;left:-9999px;top:0" aria-hidden="true"></textarea>
</div>

<script>
{
// ▼▼ Apps Script 部署網址 ▼▼
const API_URL='https://script.google.com/macros/s/AKfycbwzXFg2dJ669VXhOKs9QPvjP-ywcOA8ODsk1Det-kuz4TLljWai62hZPK31bAutQ6beIw/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MEAL={f:'空腹／飯前',a:'飯後兩小時',r:'睡前／其他'};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let me=null,recs=[],page='bp',kind='bp',days=30,regMode=false,pin='',pinFirst='',busy=false;
const bp={s:'',d:'',p:''};let fld='s',gl='',meal='f';

async function run(fn,...args){
  let r;try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify({fn,args})})}catch(e){throw new Error('連不上網路，請確認網路後再試')}
  let j;try{j=await r.json()}catch(e){throw new Error('伺服器忙碌，請稍後再試')}
  if(!j.ok)throw new Error(j.error==='AUTH'?'登入已過期，請重新登入':j.error||'發生錯誤');
  return j.data;
}
const localISO=d=>{const z=new Date(d-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,16)};
const fmt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function bpLevel(s,d){
  if(s<90||d<60)return['low','偏低','若頭暈請先坐下休息'];
  if(s>=180||d>=110)return['bad','非常高','請休息 5 分鐘再量一次；若頭痛、胸悶請立即就醫'];
  if(s>=140||d>=90)return['bad','偏高','請持續記錄，看診時告訴醫師'];
  if(s>=130||d>=80)return['warn','稍高','比目標 130/80 高一點點'];
  return['ok','理想','血壓在理想範圍，很好！'];
}
function glLevel(v,m){
  if(v<70)return['low','偏低','請吃點含糖食物，並告訴家人'];
  const hi=m==='f'?[100,126]:[140,200];
  if(v>=hi[1])return['bad','偏高','請持續記錄，看診時告訴醫師'];
  if(v>=hi[0])return['warn','稍高','比參考值高一點點'];
  return['ok','理想','血糖在理想範圍，很好！'];
}

/* 撥號鍵盤 */
function makePad(el,last,onKey){
  const keys=['1','2','3','4','5','6','7','8','9',last,'0','del'];
  el.innerHTML=keys.map(k=>k===''?'<button class="blank" tabindex="-1" type="button"></button>':
    k==='del'?'<button class="fn" data-k="del" type="button" aria-label="刪除">⌫ 刪除</button>':
    k==='clr'?'<button class="fn" data-k="clr" type="button">清除</button>':
    k==='next'?'<button class="go" data-k="next" type="button">下一格</button>':
    `<button data-k="${k}" type="button">${k}</button>`).join('');
  el.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)onKey(b.dataset.k)});
}
document.addEventListener('keydown',e=>{
  if(e.target.matches('input.txt,input[type=datetime-local]'))return;
  const k=/^\d$/.test(e.key)?e.key:e.key==='Backspace'?'del':e.key==='Enter'?'enter':null;if(!k)return;
  if(!$('vLogin').classList.contains('hide')&&!$('step2').classList.contains('hide')){if(k!=='enter')pinKey(k)}
  else if(!$('sheet').classList.contains('hide')){if(k==='enter')closeSheet()}
  else if(page==='bp'){k==='enter'?saveBp():bpKey(k)}
  else if(page==='gl'){k==='enter'?saveGl():glKey(k)}
});

/* 登入 */
const lmsg=t=>{$('loginMsg').textContent=t||''};
$('toggleReg').onclick=()=>{regMode=!regMode;$('nickWrap').classList.toggle('hide',!regMode);
  $('toggleReg').textContent=regMode?'已經有代碼了？回到登入':'第一次使用？建立新代碼';lmsg('')};
const codeVal=()=>$('code').value.trim().toLowerCase();
function toStep2(){
  const c=codeVal();if(c.length<2||/\s/.test(c)){lmsg('請輸入代碼（至少 2 個字，不能有空白）');return}
  pin='';pinFirst='';drawDots();lmsg('');
  $('codeShow').textContent='代碼：'+c+(regMode?'（建立新代碼）':'');
  $('pinPrompt').textContent=regMode?'請設定四碼驗證碼':'請輸入四碼驗證碼';
  $('step1').classList.add('hide');$('step2').classList.remove('hide');
}
$('bNext').onclick=toStep2;
$('code').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();regMode?$('nick').focus():toStep2()}});
$('nick').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();toStep2()}});
$('bBack').onclick=()=>{$('step2').classList.add('hide');$('step1').classList.remove('hide');lmsg('')};
function drawDots(){[...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i<pin.length))}
function shake(){const d=$('dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}
makePad($('padPin'),'clr',pinKey);
async function pinKey(k){
  if(busy)return;
  if(k==='del')pin=pin.slice(0,-1);else if(k==='clr')pin='';else if(pin.length<4)pin+=k;
  drawDots();if(pin.length<4)return;
  if(regMode&&!pinFirst){pinFirst=pin;pin='';$('pinPrompt').textContent='請再按一次，確認驗證碼';setTimeout(drawDots,150);return}
  if(regMode&&pin!==pinFirst){lmsg('兩次不一樣，請重新設定');shake();pin='';pinFirst='';$('pinPrompt').textContent='請設定四碼驗證碼';setTimeout(drawDots,300);return}
  busy=true;lmsg('');$('pinPrompt').textContent='請稍候…';
  try{const r=regMode?await run('register',codeVal(),$('nick').value,pin):await run('login',codeVal(),pin);enter(r.token,r.name)}
  catch(err){lmsg(err.message);shake();pin='';pinFirst='';$('pinPrompt').textContent=regMode?'請設定四碼驗證碼':'請輸入四碼驗證碼';setTimeout(drawDots,300)}
  finally{busy=false}
}

async function enter(token,name){
  me={token,name};store.set('bpbook',token);
  $('who').textContent=name+'，您好';
  $('vLogin').classList.add('hide');$('vMain').classList.remove('hide');
  resetTimes();go('bp');
  try{recs=await run('getRecords',token);render()}catch(err){kick(err)}
}
function kick(err){if(String(err.message).startsWith('登入已過期'))logout(err.message);return err.message}
function logout(m){if(me)run('logout',me.token).catch(()=>{});me=null;recs=[];store.set('bpbook',null);
  $('vMain').classList.add('hide');$('vLogin').classList.remove('hide');$('step2').classList.add('hide');$('step1').classList.remove('hide');lmsg(m||'')}
$('bOut').onclick=()=>logout();

/* 分頁 */
function go(p){page=p;
  for(const b of document.querySelectorAll('.tabbar button'))b.setAttribute('aria-selected',b.dataset.p===p);
  for(const [id,n] of [['pBp','bp'],['pGl','gl'],['pTrend','trend'],['pHist','hist']])$(id).classList.toggle('hide',n!==p);
  if(p==='bp'||p==='gl'){kind=p;syncSeg()}
  document.documentElement.style.setProperty('--acc',`var(--${(p==='bp'||p==='gl')?p:kind})`);
  if(p==='trend')drawChart();scrollTo(0,0);
}
document.querySelector('.tabbar').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.p)});
function syncSeg(){for(const s of['segT','segH'])for(const b of $(s).children)b.setAttribute('aria-pressed',b.dataset.k===kind)}
for(const s of['segT','segH'])$(s).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;kind=b.dataset.k;syncSeg();
  document.documentElement.style.setProperty('--acc',`var(--${kind})`);render()});
$('range').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;days=+b.dataset.d;for(const x of $('range').children)x.setAttribute('aria-pressed',x===b);render()});
function resetTimes(){const n=localISO(new Date());$('tBp').value=n;$('tGl').value=n}

/* 血壓輸入 */
const ORDER=['s','d','p'];
function drawBp(){for(const b of document.querySelectorAll('#pBp .fld')){const f=b.dataset.f,v=bp[f],el=b.querySelector('b');
  b.classList.toggle('on',f===fld);el.textContent=v||'—';el.classList.toggle('ph',!v)}}
document.querySelector('#pBp .fields').addEventListener('click',e=>{const b=e.target.closest('.fld');if(b){fld=b.dataset.f;drawBp()}});
makePad($('padBp'),'next',bpKey);
function bpKey(k){
  if(k==='next'){fld=ORDER[(ORDER.indexOf(fld)+1)%3];drawBp();return}
  if(k==='del'){if(!bp[fld]&&fld!=='s')fld=ORDER[ORDER.indexOf(fld)-1];bp[fld]=bp[fld].slice(0,-1);drawBp();return}
  if(bp[fld].length>=3)return;bp[fld]+=k;
  const v=bp[fld];if(fld!=='p'&&(v.length===3||(v.length===2&&+v[0]>=3)))fld=ORDER[ORDER.indexOf(fld)+1];
  drawBp();
}
async function saveBp(){
  const s=+bp.s,d=+bp.d,p=+bp.p;
  if(!s||!d){sheet('','warn','請先輸入','收縮壓（上面）和舒張壓（下面）兩個數字都要填');return}
  if(s<50||s>260||d<30||d>160||s<=d){sheet(`${s}/${d}`,'warn','數字怪怪的','上面的數字要比下面大，請再確認一次');return}
  const r={k:'bp',t:new Date($('tBp').value||Date.now()).getTime(),s,d};if(p>=30&&p<=220)r.p=p;
  const btn=$('saveBp');btn.disabled=true;btn.textContent='儲存中…';
  try{recs=await run('addRecord',me.token,r);render();const[lv,lab,txt]=bpLevel(s,d);
    sheet(`${s}/${d}`,lv,lab,'已儲存。'+txt+(r.p?`（脈搏 ${r.p}）`:''));bp.s=bp.d=bp.p='';fld='s';drawBp();resetTimes()}
  catch(err){sheet('','bad','沒存成功',kick(err))}
  finally{btn.disabled=false;btn.textContent='儲存血壓'}
}
$('saveBp').onclick=saveBp;

/* 血糖輸入 */
function drawGl(){const el=$('glVal');el.textContent=gl||'—';el.classList.toggle('ph',!gl)}
makePad($('padGl'),'clr',glKey);
function glKey(k){if(k==='del')gl=gl.slice(0,-1);else if(k==='clr')gl='';else if(gl.length<3)gl+=k;drawGl()}
$('meal').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;meal=b.dataset.m;for(const x of $('meal').children)x.setAttribute('aria-pressed',x===b)});
async function saveGl(){
  const v=+gl;if(!v){sheet('','warn','請先輸入','請用下面的數字鍵輸入血糖值');return}
  if(v<20||v>600){sheet(String(v),'warn','數字怪怪的','血糖值應在 20 到 600 之間，請再確認');return}
  const m=meal,btn=$('saveGl');btn.disabled=true;btn.textContent='儲存中…';
  try{recs=await run('addRecord',me.token,{k:'gl',t:new Date($('tGl').value||Date.now()).getTime(),v,m});render();
    const[lv,lab,txt]=glLevel(v,m);sheet(String(v),lv,lab,`已儲存（${MEAL[m]}）。${txt}`);gl='';drawGl();resetTimes()}
  catch(err){sheet('','bad','沒存成功',kick(err))}
  finally{btn.disabled=false;btn.textContent='儲存血糖'}
}
$('saveGl').onclick=saveGl;

/* 結果視窗 */
function sheet(big,lv,lab,txt){$('shBig').textContent=big;$('shBig').classList.toggle('hide',!big);
  $('shLab').className='lab lv-'+lv;$('shLab').textContent=lab;$('shTxt').textContent=txt;$('sheet').classList.remove('hide');$('shOk').focus()}
function closeSheet(){$('sheet').classList.add('hide')}
$('shOk').onclick=closeSheet;$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet()});

/* 報告 */
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function fit(pts){if(pts.length<3)return null;const mx=avg(pts.map(p=>p[0])),my=avg(pts.map(p=>p[1]));
  let a=0,b=0;for(const[x,y]of pts){a+=(x-mx)*(y-my);b+=(x-mx)**2}if(!b)return null;const k=a/b;return{k,c:my-k*mx}}
function trendWord(f,unit,name){if(!f)return`${name}要有 3 筆以上紀錄才看得出趨勢。`;
  const w=f.k*7*864e5;if(Math.abs(w)<0.5)return`${name}這段期間大致持平。`;
  return`${name}平均每週${w<0?'下降':'上升'}約 ${Math.abs(w).toFixed(1)} ${unit}${w<0?'，往好的方向走。':'，請多留意。'}`}
const inRange=()=>{const from=Date.now()-days*864e5;return recs.filter(r=>r.t>=from).sort((a,b)=>a.t-b.t)};
let C={};
function render(){if(!me)return;
  const R=inRange(),B=R.filter(r=>r.k==='bp'),G=R.filter(r=>r.k==='gl'),gf=G.filter(r=>r.m==='f'),ga=G.filter(r=>r.m==='a');
  C={B,G,gf,ga,fs:fit(B.map(r=>[r.t,r.s])),fd:fit(B.map(r=>[r.t,r.d])),ffg:fit(gf.map(r=>[r.t,r.v])),fag:fit(ga.map(r=>[r.t,r.v]))};
  if(kind==='bp'){
    const ok=B.filter(r=>bpLevel(r.s,r.d)[0]==='ok').length;
    $('tiles').innerHTML=B.length?`<div class="tile"><div class="k">平均血壓</div><div class="v">${Math.round(avg(B.map(r=>r.s)))}/${Math.round(avg(B.map(r=>r.d)))}</div><div class="d">共 ${B.length} 次</div></div><div class="tile"><div class="k">在理想範圍</div><div class="v">${Math.round(ok/B.length*100)}%</div><div class="d">最高 ${Math.max(...B.map(r=>r.s))}/${Math.max(...B.map(r=>r.d))}</div></div>`:'';
    $('legend').innerHTML='<span><i class="sw" style="background:var(--bp)"></i>收縮壓</span><span><i class="sw" style="background:var(--bp2)"></i>舒張壓</span><span><i class="sw" style="border-top:3px dashed var(--mute);height:0"></i>趨勢線</span><span><i class="sw" style="border-top:2px dotted var(--mute);height:0"></i>參考 130／80</span>';
    $('trend').textContent=B.length?trendWord(C.fs,'mmHg','收縮壓'):'這段期間還沒有血壓紀錄。';
  }else{
    $('tiles').innerHTML=G.length?`<div class="tile"><div class="k">空腹平均</div><div class="v">${gf.length?Math.round(avg(gf.map(r=>r.v))):'—'}</div><div class="d">${gf.length} 次 · mg/dL</div></div><div class="tile"><div class="k">飯後平均</div><div class="v">${ga.length?Math.round(avg(ga.map(r=>r.v))):'—'}</div><div class="d">${ga.length} 次 · mg/dL</div></div>`:'';
    $('legend').innerHTML='<span><i class="sw" style="background:var(--gl)"></i>空腹／飯前</span><span><i class="sw" style="background:var(--warn)"></i>飯後</span><span><i class="sw" style="background:var(--mute)"></i>其他</span><span><i class="sw" style="border-top:2px dotted var(--mute);height:0"></i>參考 100／140</span>';
    $('trend').textContent=G.length?(gf.length>=3?trendWord(C.ffg,'mg/dL','空腹血糖'):trendWord(C.fag,'mg/dL','飯後血糖')):'這段期間還沒有血糖紀錄。';
  }
  renderHist();drawChart();
}
function drawChart(){
  if(page!=='trend'||!C.B)return;const svg=$('svg'),W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
  const series=kind==='bp'?[{p:C.B.map(r=>[r.t,r.s]),c:'var(--bp)',l:1,f:C.fs},{p:C.B.map(r=>[r.t,r.d]),c:'var(--bp2)',l:1,f:C.fd}]
    :[{p:C.gf.map(r=>[r.t,r.v]),c:'var(--gl)',l:1,f:C.ffg},{p:C.ga.map(r=>[r.t,r.v]),c:'var(--warn)',l:1,f:C.fag},{p:C.G.filter(r=>r.m==='r').map(r=>[r.t,r.v]),c:'var(--mute)'}];
  const refs=kind==='bp'?[130,80]:[100,140],all=series.flatMap(s=>s.p.map(p=>p[1]));
  if(!all.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--mute)" font-size="16">還沒有資料，先量一次吧</text>`;return}
  let lo=Math.min(kind==='bp'?70:80,...all),hi=Math.max(kind==='bp'?140:160,...all);lo=Math.floor((lo-5)/10)*10;hi=Math.ceil((hi+5)/10)*10;
  const L=36,Rm=8,T=10,Bm=26,from=Date.now()-days*864e5,to=Date.now(),X=t=>L+(t-from)/(to-from)*(W-L-Rm),Y=v=>T+(hi-v)/(hi-lo)*(H-T-Bm);
  let g='';const step=(hi-lo)>120?40:20;
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+=`<line x1="${L}" x2="${W-Rm}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+5}" text-anchor="end" font-size="13" fill="var(--mute)">${v}</text>`;
  for(let i=0;i<=3;i++){const t=from+(to-from)*i/3,d=new Date(t);g+=`<text x="${X(t)}" y="${H-6}" text-anchor="${i===0?'start':i===3?'end':'middle'}" font-size="13" fill="var(--mute)">${d.getMonth()+1}/${d.getDate()}</text>`}
  for(const r of refs)g+=`<line x1="${L}" x2="${W-Rm}" y1="${Y(r)}" y2="${Y(r)}" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="2 4"/>`;
  for(const s of series){if(!s.p.length)continue;
    if(s.l&&s.p.length>1)g+=`<polyline fill="none" stroke="${s.c}" stroke-width="3" stroke-linejoin="round" points="${s.p.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`;
    g+=s.p.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5" fill="${s.c}" stroke="var(--card)" stroke-width="2"/>`).join('');
    if(s.f){const a=s.p[0][0],b=s.p[s.p.length-1][0];g+=`<line x1="${X(a)}" y1="${Y(s.f.k*a+s.f.c)}" x2="${X(b)}" y2="${Y(s.f.k*b+s.f.c)}" stroke="${s.c}" stroke-width="2.5" stroke-dasharray="8 6" opacity=".85"/>`}}
  svg.innerHTML=g;
}
const ro=new ResizeObserver(drawChart);ro.observe($('fig'));

function renderHist(){
  const list=recs.filter(r=>r.k===kind).slice(0,200);
  if(!list.length){$('hist').innerHTML=`<li class="empty">還沒有${kind==='bp'?'血壓':'血糖'}紀錄</li>`;return}
  $('hist').innerHTML=list.map(r=>{const b=r.k==='bp',lv=b?bpLevel(r.s,r.d):glLevel(r.v,r.m);
    return`<li><div><div class="hv">${b?esc(r.s)+'/'+esc(r.d):esc(r.v)}<span class="tag lv-${lv[0]}">${lv[1]}</span></div><div class="hm">${fmt(r.t)}${b?(r.p?' · 脈搏 '+esc(r.p):''):' · '+esc(MEAL[r.m]||'')}</div></div><button class="small" data-del="${esc(r.id)}" type="button">刪除</button></li>`}).join('');
}
$('hist').addEventListener('click',async e=>{const b=e.target.closest('[data-del]');if(!b)return;
  if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='確定刪除？';b.style.color='var(--bad)';setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent='刪除';b.style.color=''}},4000);return}
  b.disabled=true;b.textContent='刪除中…';try{recs=await run('deleteRecord',me.token,b.dataset.del);render()}catch(err){b.disabled=false;b.textContent='失敗';kick(err)}});

$('bCopy').onclick=async()=>{if(!C.B)return;const L=[`${me.name} 近 ${days} 天血壓血糖報告（${new Date().toLocaleDateString('zh-TW')}）`];
  if(C.B.length)L.push(`血壓 ${C.B.length} 次，平均 ${Math.round(avg(C.B.map(r=>r.s)))}/${Math.round(avg(C.B.map(r=>r.d)))} mmHg。${trendWord(C.fs,'mmHg','收縮壓')}`);
  if(C.gf.length)L.push(`空腹血糖 ${C.gf.length} 次，平均 ${Math.round(avg(C.gf.map(r=>r.v)))} mg/dL`);
  if(C.ga.length)L.push(`飯後血糖 ${C.ga.length} 次，平均 ${Math.round(avg(C.ga.map(r=>r.v)))} mg/dL`);
  L.push('','明細：',...[...C.B,...C.G].sort((a,b)=>a.t-b.t).map(r=>r.k==='bp'?`${fmt(r.t)} 血壓 ${r.s}/${r.d}${r.p?' 脈搏 '+r.p:''}`:`${fmt(r.t)} 血糖 ${r.v}（${MEAL[r.m]||''}）`));
  const text=L.join('\n');let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
  if(!ok){try{const t=$('copyBox');t.value=text;t.select();ok=document.execCommand('copy')}catch(e){}}
  $('copyMsg').textContent=ok?'已複製，可以貼到 LINE':'無法自動複製，請截圖分享'};

drawBp();drawGl();
(async()=>{const t=store.get('bpbook');if(!t)return;
  $('vLogin').classList.add('hide');
  try{const r=await run('whoAmI',t);enter(t,r.name)}catch(e){store.set('bpbook',null);$('vLogin').classList.remove('hide')}})();
}
</script>
</body>
